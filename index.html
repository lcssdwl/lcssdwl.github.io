<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>lcssdwl · 项目主页</title>
<meta name="description" content="lcssdwl 的项目导航：云韵音乐介绍页等站点入口。" />
<meta name="theme-color" content="#7C4DFF" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C4DFF'/%3E%3Cstop offset='.55' stop-color='%23FF6B9D'/%3E%3Cstop offset='1' stop-color='%23FFA94D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='17' font-weight='700' fill='%23fff' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --primary:#7C4DFF; --accent:#FF6B9D; --warm:#FFA94D;
    --bg:#14121A; --card:rgba(255,255,255,.05); --border:rgba(255,255,255,.09);
    --text:#F3F1FA; --muted:#A9A3BE; --radius:18px; --maxw:900px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.7;-webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(900px 520px at 10% -10%, rgba(124,77,255,.32), transparent 60%),
      radial-gradient(760px 480px at 92% 0%, rgba(255,107,157,.22), transparent 62%),
      radial-gradient(700px 500px at 55% 105%, rgba(255,169,77,.14), transparent 60%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:52px 52px;
    mask-image:radial-gradient(circle at 50% 15%,#000 0%,transparent 80%);
  }
  a{color:inherit;text-decoration:none}
  header,main,footer{flex-shrink:0}
  main{flex:1 0 auto}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  .grad{background:linear-gradient(100deg,var(--primary),var(--accent) 55%,var(--warm));-webkit-background-clip:text;background-clip:text;color:transparent}

  header{padding:72px 0 26px;text-align:center}
  .avatar{
    width:76px;height:76px;border-radius:24px;margin:0 auto 20px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--primary),var(--accent) 55%,var(--warm));
    box-shadow:0 16px 40px rgba(124,77,255,.42);font-size:34px;font-weight:800;
  }
  h1{margin:0;font-size:clamp(30px,4.4vw,44px);letter-spacing:-.5px}
  .tagline{margin:12px auto 0;color:var(--muted);font-size:16.5px;max-width:42ch}
  .meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
  .meta a{
    font-size:13.5px;color:var(--muted);border:1px solid var(--border);background:rgba(255,255,255,.04);
    border-radius:999px;padding:7px 15px;display:inline-flex;align-items:center;gap:7px;transition:.2s;
  }
  .meta svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  .sec-title{
    display:flex;align-items:center;gap:14px;margin:30px 0 14px;font-size:13px;
    letter-spacing:2.4px;text-transform:uppercase;color:var(--accent);font-weight:600;
  }
  .sec-title::after{content:"";flex:1;height:1px;background:var(--border)}

  .list{display:grid;gap:10px;padding-bottom:44px}
  .empty{color:var(--muted);font-size:13px;padding:10px 2px}
  .item{
    display:block;border:1px solid var(--border);border-radius:14px;padding:13px 16px;
    background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .item::before{
    content:"";position:absolute;top:-70px;right:-70px;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle,rgba(124,77,255,.32),transparent 70%);
  }
  .row{display:flex;align-items:center;gap:13px;position:relative}
  .ic{
    flex:0 0 38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(135deg,rgba(124,77,255,.30),rgba(255,107,157,.22));border:1px solid rgba(255,255,255,.10);
  }
  .ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .body{flex:1;min-width:0}
  .name{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;line-height:1.4}
  .pill{font-size:11px;font-weight:600;color:var(--warm);border:1px solid rgba(255,169,77,.4);background:rgba(255,169,77,.10);border-radius:999px;padding:1px 8px}
  .desc{
    margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.5;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .arrow{
    flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;
    border:1px solid var(--border);background:rgba(255,255,255,.04);transition:.2s;
  }
  .arrow svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}

  .detail{position:relative;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  .detail p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.65}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .tags span{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.03)}
  .go{
    margin-top:12px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;color:var(--text);
    padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.05);
    -webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s,color .15s,transform .1s;
  }
  .go svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}

  /* 悬停效果只在真实鼠标设备上生效，避免手机点击后高亮/位移残留 */
  @media (hover:hover) and (pointer:fine){
    .item:hover{transform:translateY(-2px);border-color:rgba(124,77,255,.55);box-shadow:0 14px 30px rgba(0,0,0,.38)}
    .item:hover .arrow{border-color:rgba(124,77,255,.6);background:rgba(124,77,255,.16);transform:translateX(3px)}
    .item:hover .go svg{transform:translateX(3px)}
    .meta a:hover{color:var(--text);border-color:rgba(124,77,255,.5);transform:translateY(-1px)}
    .foot a:hover{color:var(--text)}
  }

  /* 触摸设备的点击反馈 */
  .item:active{background:rgba(255,255,255,.10);border-color:rgba(124,77,255,.45)}
  .go:active{background:rgba(124,77,255,.26);border-color:rgba(124,77,255,.7);color:#fff;transform:scale(.98)}
  .arrow:active{background:rgba(124,77,255,.22);border-color:rgba(124,77,255,.6)}

  footer{border-top:1px solid var(--border);padding:26px 0 36px;background:rgba(0,0,0,.18)}
  .foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}

  .reveal{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:none}
  @media (max-width:600px){
    header{padding:52px 0 20px}
    .item{padding:12px 14px}
    .detail{display:none}
    .item.open .detail{display:block}
    .arrow svg{transform:rotate(90deg)}
    .item.open .arrow svg{transform:rotate(-90deg)}
    .item{-webkit-tap-highlight-color:transparent}
    .detail,.go{user-select:none}
  }
</style>
</head>
<body>

<header class="wrap">
  <div class="avatar">L</div>
  <h1><span class="grad">lcssdwl</span></h1>
  <p class="tagline">项目与站点导航，下面是目前公开的全部页面。</p>
  <div class="meta">
    <a href="https://github.com/lcssdwl">
      <svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6-1.5 6-6.5a5 5 0 0 0-1.4-3.5 4.6 4.6 0 0 0-.1-3.5s-1.4-.4-4.5 1.7a12 12 0 0 0-6.2 0C5.8.6 4.4 1 4.4 1a4.6 4.6 0 0 0-.1 3.5A5 5 0 0 0 2.9 8c0 5 3 6.2 6 6.5a3.4 3.4 0 0 0-.9 2.6V22"/></svg>
      GitHub 主页
    </a>
    <a href="https://github.com/lcssdwl?tab=repositories">
      <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
      全部仓库
    </a>
  </div>
</header>

<main class="wrap">
  <div class="sec-title reveal">PROJECTS</div>
  <div class="list" id="list"><div class="empty">加载中…</div></div>
</main>

<footer>
  <div class="wrap foot">
    <div>GitHub Pages</div>
  </div>
</footer>

<script>
  const io = new IntersectionObserver((es) => {
    es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: .15 });
  document.querySelectorAll('.reveal').forEach((el, i) => {
    el.style.transitionDelay = (i % 4) * 70 + 'ms';
    io.observe(el);
  });

  // 手机端：点卡片展开/收起详情，只有点「打开站点」才真正跳转
  const mq = window.matchMedia('(max-width: 600px)');
  function bindFold() {
    document.querySelectorAll('.item').forEach((item) => {
      item.addEventListener('click', (e) => {
        if (!mq.matches) return;
        if (e.target.closest('.go')) return;
        e.preventDefault();
        item.classList.toggle('open');
      });
    });
  }
  bindFold();

  // 列表数据放在 list.json，改这个文件即可增删项目
  const ICONS = {
    music: '<circle cx="9" cy="16.5" r="2.6"/><circle cx="17" cy="15" r="2.6"/><path d="M11.5 16.5V7.5l5.5-1.2v8.7"/>',
    web: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3.6 3 14.4 0 18"/><path d="M12 3c-3 3.6-3 14.4 0 18"/>',
    box: '<path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/>'
  };
  const ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>';

  function cardHTML(p) {
    const icon = ICONS[p.icon] || ICONS.web;
    const badge = p.badge ? ' <span class="pill">' + p.badge + '</span>' : '';
    const tags = (p.tags || []).map(t => '<span>' + t + '</span>').join('');
    return '<a class="item reveal in" href="' + p.url + '">' +
      '<div class="row">' +
        '<div class="ic"><svg viewBox="0 0 24 24">' + icon + '</svg></div>' +
        '<div class="body">' +
          '<div class="name">' + p.name + badge + '</div>' +
          '<p class="desc">' + (p.desc || '') + '</p>' +
        '</div>' +
        '<span class="arrow">' + ARROW + '</span>' +
      '</div>' +
      '<div class="detail">' +
        (p.detail ? '<p>' + p.detail + '</p>' : '') +
        (tags ? '<div class="tags">' + tags + '</div>' : '') +
        '<span class="go">打开站点 ' + (p.site || p.url) + ' ' + ARROW + '</span>' +
      '</div>' +
    '</a>';
  }

  fetch('list.json')
    .then(r => r.json())
    .then(data => {
      const list = data.projects || data;
      document.getElementById('list').innerHTML = list.map(cardHTML).join('');
      bindFold();
    })
    .catch(() => {
      document.getElementById('list').innerHTML = '<div class="empty">列表加载失败，请检查 list.json</div>';
    });
</script>
</body>
</html>
